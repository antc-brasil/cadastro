# Publica a página do Cadastro no GitHub Pages.
# Em Settings > Pages, a origem ("Source") deve ser "GitHub Actions".
# Não há etapa de geração aqui: dados.js é gerado localmente a partir da planilha
# (que nunca vem para o repositório), e o workflow só publica os arquivos prontos.
name: Publicar cadastro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Publica só o que a página usa (ferramentas/ e README ficam de fora)
      - run: mkdir _site && cp index.html dados.js mapa.js _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
